<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabSpan promo artwork</title>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("./fonts/Manrope-Medium.otf") format("opentype");
        font-weight: 500;
      }

      @font-face {
        font-family: "Manrope";
        src: url("./fonts/Manrope-Bold.otf") format("opentype");
        font-weight: 700;
      }

      @font-face {
        font-family: "Manrope";
        src: url("./fonts/Manrope-ExtraBold.otf") format("opentype");
        font-weight: 800;
      }

      :root {
        color-scheme: dark;
        font-family: "Manrope", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #071033;
      }

      .artboard {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        isolation: isolate;
        background: #071033;
      }

      .key-visual {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: -2;
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgba(3, 9, 34, 0.96) 0%, rgba(3, 9, 34, 0.78) 30%, rgba(3, 9, 34, 0.06) 63%),
          linear-gradient(0deg, rgba(3, 9, 34, 0.18), transparent 45%);
      }

      .copy {
        position: absolute;
        top: 50%;
        left: 7.2%;
        width: 39%;
        transform: translateY(-50%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
        color: #dfe9ff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.016em;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      h1 {
        max-width: 600px;
        margin: 0;
        color: #fff;
        font-size: clamp(48px, 5.4vw, 76px);
        font-weight: 800;
        line-height: 1.03;
        letter-spacing: -0.04em;
      }

      h1 span {
        color: #a9c2ff;
      }

      p {
        max-width: 500px;
        margin: 24px 0 0;
        color: #b8c8f8;
        font-size: clamp(19px, 1.8vw, 25px);
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.015em;
      }

      .small .key-visual {
        transform: scale(1.26);
        transform-origin: center 70%;
      }

      .small .shade {
        background:
          linear-gradient(180deg, rgba(3, 9, 34, 0.93) 0%, rgba(3, 9, 34, 0.42) 52%, rgba(3, 9, 34, 0.08) 100%);
      }

      .small .copy {
        top: 26px;
        left: 28px;
        width: 86%;
        transform: none;
      }

      .small .brand {
        gap: 8px;
        margin-bottom: 11px;
        font-size: 17px;
      }

      .small .brand img {
        width: 28px;
        height: 28px;
      }

      .small h1 {
        width: 390px;
        font-size: 43px;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .small p {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="artboard">
      <img class="key-visual" src="../assets/source/connected-windows.png" alt="" />
      <div class="shade"></div>
      <section class="copy">
        <div class="brand">
          <img src="../../icons/icon128.png" alt="" />
          <span>TabSpan</span>
        </div>
        <h1>Every tab.<br /><span>Across every window.</span></h1>
        <p>One live side panel for all your Chrome windows.</p>
      </section>
    </main>
    <script>
      const format = new URLSearchParams(location.search).get("format");
      if (format === "small") {
        document.body.classList.add("small");
      }
    </script>
  </body>
</html>
