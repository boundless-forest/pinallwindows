<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ztab</title>
    <link rel="stylesheet" href="src/tab-tree.css" />
  </head>
  <body class="side-panel">
    <main class="app">
      <header class="topbar">
        <div class="shortcut-help" aria-label="Keyboard shortcuts">
          <button id="open-shortcut" class="help-item shortcut-settings" type="button" title="Change this shortcut in Chrome's extension shortcut settings" aria-label="Customize the ztab panel shortcut">
            <span id="open-shortcut-keys" class="shortcut-keys"></span>
            <span id="open-shortcut-label">Open panel</span>
          </button>
          <span class="help-separator" aria-hidden="true">·</span>
          <span class="help-item"><kbd>↑</kbd><kbd>↓</kbd> Select</span>
          <span class="help-separator" aria-hidden="true">·</span>
          <span class="help-item"><kbd>Enter</kbd> Open</span>
        </div>
        <button id="refresh" class="refresh-button" type="button">Refresh</button>
      </header>

      <div id="mode-bar" class="mode-bar" hidden></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="tab-list" class="tab-list" role="listbox" aria-label="All tabs" tabindex="0"></div>

      <footer class="summary-footer">
        <span class="brand-name">ztab</span>
        <p id="summary" class="summary">Loading tabs...</p>
        <a href="options.html" target="_blank" rel="noopener" class="settings-link" aria-label="ztab settings">Settings</a>
      </footer>
    </main>

    <script type="module" src="src/tab-tree.js"></script>
  </body>
</html>
